name: ci

on:
  push:
    branches: [main, codex/auditgym-studio]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: Install
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Studio frontend tests
        run: node --test tests/test_web_ui.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t auditgym .
      - name: Smoke run offline
        run: docker run --rm --network none --cpus 2 --memory 4g auditgym all --skip-tests

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: Install
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Studio frontend tests
        run: node --test tests/test_web_ui.mjs
      - name: Generate trajectories for the 50-episode leakage check
        working-directory: ${{ runner.temp }}
        run: uv run --project "$GITHUB_WORKSPACE" fintrace all --n 25 --skip-tests
      - name: Check recorded trajectories
        env:
          FINTRACE_TEST_EPISODES: ${{ runner.temp }}/data
          FINTRACE_TEST_RUNS: ${{ runner.temp }}/runs
        run: uv run pytest -q tests/leakage/test_policy_trajectories.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fintrace .
      - name: Smoke run offline
        run: docker run --rm --network none --cpus 2 --memory 4g fintrace all

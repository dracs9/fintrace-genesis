[project]
name = "auditgym"
version = "1.0.0"
description = "Reproducible RL environment for an AI auditor (GENESIS 2026 FinTech)"
license = "Apache-2.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "gymnasium>=0.29",
]

[project.scripts]
auditgym = "auditgym.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
